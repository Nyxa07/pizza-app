<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ "pages.guides.title" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{
        "pages.guides.faq.title" | translate
      }}</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-card [routerLink]="['/tabs/guides/faq']">
          <ion-card-header>
            <ion-card-title>
              {{ "pages.guides.faq.title" | translate }}
            </ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p>{{ "pages.guides.faq.description" | translate }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
