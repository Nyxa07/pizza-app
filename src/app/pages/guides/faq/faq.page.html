<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/guides"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'pages.guides.faq.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"
        >{{ 'pages.guides.faq.title' | translate }}</ion-title
      >
    </ion-toolbar>
  </ion-header>
  <app-faq></app-faq>
</ion-content>
