<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-title>{{ "pages.calculator.guided.title" | translate }}</ion-title>
    <ion-buttons slot="end">
      <app-calculator-refresh-button />
      <ion-button
        [routerLink]="['/settings']"
        [attr.aria-label]="'pages.settings.title' | translate"
      >
        <i-lucide slot="icon-only" [img]="SettingsIcon" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{
        "pages.calculator.guided.title" | translate
      }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="app-page-layout">
    <app-calculator-path-switch />

    @if (isInitialized()) {
      <app-guided-form />
    } @else {
      <div class="loading-skeleton">
        <ion-item lines="none">
          <ion-skeleton-text animated style="width: 60%" />
        </ion-item>
      </div>
    }
  </div>
</ion-content>
