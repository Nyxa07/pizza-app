<ion-header [translucent]="false">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ "pages.calculator.results.title" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"
        >{{ "pages.calculator.results.title" | translate }}</ion-title
      >
    </ion-toolbar>
  </ion-header>
  <app-calculator-results></app-calculator-results>
</ion-content>
