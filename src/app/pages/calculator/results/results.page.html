@let poolishRecipe = poolishRecipe$ | async; @let doughRecipe = doughRecipe$ |
async;

<ion-header [translucent]="false">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ "pages.calculator.results.title" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"
        >{{ "pages.calculator.results.title" | translate }}</ion-title
      >
    </ion-toolbar>
  </ion-header>

  @if (poolishRecipe) {
  <app-recipe [recipe]="poolishRecipe"></app-recipe>
  } @if (doughRecipe) {
  <app-recipe [recipe]="doughRecipe"></app-recipe>
  }
</ion-content>
