<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/calculator/expert"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ "pages.calculator.method.title" | translate }}</ion-title>
    <ion-buttons slot="end">
      <app-calculator-state-share
        [method]="isInitialized() ? method() : null"
      ></app-calculator-state-share>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{
        "pages.calculator.method.title" | translate
      }}</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (isInitialized()) {
    @if (method(); as method) {
      <app-method [method]="method"></app-method>
    } @else {
      <div class="loading-skeleton ion-padding">
        <ion-item lines="none">
          <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
        </ion-item>
      </div>
    }
  } @else {
    <div class="loading-skeleton ion-padding">
      <ion-item lines="none">
        <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
      </ion-item>
    </div>
  }
</ion-content>
