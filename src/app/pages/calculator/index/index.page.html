<ion-header [translucent]="false">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ "pages.calculator.title" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"
        >{{ "pages.calculator.title" | translate }}</ion-title
      >
    </ion-toolbar>
  </ion-header>
  @for (item of items; track item.title) {
  <ion-card (click)="item.action()">
    <ion-card-header>
      <ion-card-title>{{ item.title | translate }}</ion-card-title>
    </ion-card-header>
    <ion-card-content> {{ item.description | translate }} </ion-card-content>
  </ion-card>
  }
</ion-content>
