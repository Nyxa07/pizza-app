<ion-content [fullscreen]="true">
  <ion-segment-view>
    <ion-segment-content id="data">
      <ion-card>
        <ion-card-header>
          <ion-card-title
            >{{ TranslationKeys.TAB1.CONFIGURATION.TITLE | translate
            }}</ion-card-title
          >
          <ion-card-subtitle
            >{{ TranslationKeys.TAB1.CONFIGURATION.SUBTITLE | translate
            }}</ion-card-subtitle
          >
        </ion-card-header>
        <ion-card-content>
          <app-dough-form (onChange)="data.set($event)"></app-dough-form>
        </ion-card-content>
      </ion-card>

      <ion-card>
        <ion-card-header>
          <ion-card-title
            >{{ TranslationKeys.TAB1.INGREDIENTS.TITLE | translate
            }}</ion-card-title
          >
          <ion-card-subtitle
            >{{ TranslationKeys.TAB1.INGREDIENTS.SUBTITLE | translate
            }}</ion-card-subtitle
          >
        </ion-card-header>
        <ion-card-content>
          <app-dough-quantity [result]="result()"></app-dough-quantity>
        </ion-card-content>
      </ion-card>
    </ion-segment-content>

    <ion-segment-content id="recipe">
      @if (result()) {
      <app-dough-poolish-recipe [result]="result()"></app-dough-poolish-recipe>
      }
    </ion-segment-content>
  </ion-segment-view>
</ion-content>
