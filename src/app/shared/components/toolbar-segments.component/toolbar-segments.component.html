@if (segments().length > 0) {
  <ion-toolbar color="primary">
    <ion-segment [value]="segments()[0].value">
      @for (segment of segments(); track segment.value) {
        <ion-segment-button [value]="segment.value" [contentId]="segment.value">
          <ion-label>{{ segment.name }}</ion-label>
        </ion-segment-button>
      }
    </ion-segment>
  </ion-toolbar>
}
