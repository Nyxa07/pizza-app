<ion-tabs>
  <!-- Language switcher in header -->
  <ion-header [translucent]="false" mode="ios">
    <ion-toolbar color="primary">
      <ion-title
        >{{ TranslationKeys.NAVIGATION.HEADER.TITLE | translate }}</ion-title
      >
      <ion-buttons slot="end">
        <app-language-switcher></app-language-switcher>
      </ion-buttons>
    </ion-toolbar>
    <app-toolbar-segments></app-toolbar-segments>
  </ion-header>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon name="bug"></ion-icon>
      <ion-label
        >{{ TranslationKeys.NAVIGATION.TABS.POOLISH_STYLE | translate
        }}</ion-label
      >
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="ellipse"></ion-icon>
      <ion-label
        >{{ TranslationKeys.NAVIGATION.TABS.TAB2 | translate }}</ion-label
      >
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="square"></ion-icon>
      <ion-label
        >{{ TranslationKeys.NAVIGATION.TABS.TAB3 | translate }}</ion-label
      >
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
