apply plugin: 'com.android.application'

def requiredReleaseSigningSettings = [
    'ANDROID_RELEASE_STORE_FILE',
    'ANDROID_RELEASE_STORE_PASSWORD',
    'ANDROID_RELEASE_KEY_ALIAS',
    'ANDROID_RELEASE_KEY_PASSWORD',
]
def releaseSigningSettings = requiredReleaseSigningSettings.collectEntries {
    [(it): System.getenv(it)]
}
def missingReleaseSigningSettings = requiredReleaseSigningSettings.findAll {
    !releaseSigningSettings[it]
}
def releaseSigningConfigured = missingReleaseSigningSettings.isEmpty()
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def releaseStoreFile = null
def devBuildLabel = System.getenv('ANDROID_DEV_BUILD_LABEL')

if (releaseSigningConfigured) {
    releaseStoreFile = new File(releaseSigningSettings['ANDROID_RELEASE_STORE_FILE'])
    if (!releaseStoreFile.isAbsolute()) {
        releaseStoreFile = new File(
            rootProject.projectDir.parentFile,
            releaseSigningSettings['ANDROID_RELEASE_STORE_FILE'],
        )
    }
}

android {
    namespace = "com.pizzamaker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pizzamaker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "2.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = releaseStoreFile
                storePassword = releaseSigningSettings['ANDROID_RELEASE_STORE_PASSWORD']
                keyAlias = releaseSigningSettings['ANDROID_RELEASE_KEY_ALIAS']
                keyPassword = releaseSigningSettings['ANDROID_RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Sideloadable APK for device testing, never uploaded to Google Play.
        // Play App Signing replaces the upload-key signature with Google's own,
        // so this build can never match the Store install. The suffixed
        // applicationId lets both sit on the same device instead of colliding.
        devRelease {
            initWith release
            applicationIdSuffix = '.dev'
            versionNameSuffix = devBuildLabel ? "-dev.${devBuildLabel}" : '-dev'
            // Capacitor subprojects only declare debug and release variants.
            matchingFallbacks = ['release']
        }
    }
}

if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
        "Missing Android release signing settings: ${missingReleaseSigningSettings.join(', ')}",
    )
}

if (releaseTaskRequested && !releaseStoreFile.isFile()) {
    throw new GradleException(
        "Android release keystore not found: ${releaseStoreFile}",
    )
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
